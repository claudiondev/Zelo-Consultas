<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 2.5cm; }
        body { font-family: "Times New Roman", Georgia, serif; font-size: 12pt; color: #000; }

        .cabecalho { text-align: center; margin-bottom: 50px; }
        .clinica-nome { font-size: 22pt; font-weight: bold; letter-spacing: 1px; }
        .clinica-info { font-size: 9pt; margin-top: 2px; }

        .titulo {
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
            font-size: 13pt;
            margin: 30px 0 45px;
        }

        .corpo { text-align: justify; line-height: 1.9; text-indent: 3em; }

        .data { margin-top: 70px; text-align: center; }

        .assinatura { margin-top: 90px; text-align: center; }
        .assinatura .linha { border-top: 1px solid #000; width: 60%; margin: 0 auto 4px; }
    </style>
</head>
<body>
<div class="cabecalho">
    <div class="clinica-nome" th:text="${clinica.nome}">CLINICA</div>
    <div class="clinica-info" th:text="${clinica.razaoSocial}">razao social</div>
    <div class="clinica-info" th:text="${clinica.endereco}">endereco</div>
    <div class="clinica-info" th:text="${clinica.complemento}">complemento</div>
</div>

<div class="titulo">ATESTADO MÉDICO</div>

<p class="corpo" th:text="${texto}">Corpo do atestado.</p>

<div class="data" th:text="${cidade} + ', ' + ${dataExtenso} + '.'">Cidade, data.</div>

<div class="assinatura">
    <div class="linha"></div>
    <div th:text="${medica.nome}">Nome da medica</div>
    <div th:text="${medica.titulo}">Titulo</div>
    <div th:text="${medica.crm}">CRM</div>
</div>
</body>
</html>
